<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>編輯專區 — 投稿審查系統</title>
    <style>
        body { background-color: #f7f5f0; font-family: "Noto Serif TC", serif; color: #4a453e; padding: 40px; margin: 0; }
        .container { max-width: 720px; margin: auto; background: #fffdf9; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(163, 153, 140, 0.1); border: 1px solid #e6e2d6; }
        h2 { font-weight: 400; letter-spacing: 1px; border-bottom: 1px solid #eef0eb; padding-bottom: 10px; color: #5c5346; }
        .item { border-bottom: 1px dashed #e2ded4; padding: 20px 0; display: flex; justify-content: space-between; align-items: flex-start; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; max-width: 720px; margin: auto; }
        .back-btn { background: transparent; color: #7d7365; border: 1px solid #dcd6c8; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 13px; }
        .btn-pass { background: #6b7a67; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-reject { background: #9c6b63; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .tag { font-size: 12px; background: #ede8dc; padding: 2px 8px; border-radius: 4px; color: #6e6558; }
    </style>
</head>
<body>
<div class="top-bar">
    <span>🖋️ 編輯專區：稿件審閱與編排</span>
    <a href="/" class="back-btn">登出 / 返回登入</a>
</div>

<div class="container">
    <h2>待審查投稿清單</h2>
    <div id="editor-list" style="color: #8c8275;">載入中...</div>
</div>

<script>
async function loadEditorSubmissions() {
    const res = await fetch('/api/submissions');
    const data = await res.json();
    const listDiv = document.getElementById('editor-list');
    
    if (data.length === 0) {
        listDiv.innerHTML = '<p>目前沒有任何待審查的投稿。</p>';
        return;
    }

    listDiv.innerHTML = data.map(item => `
        <div class="item">
            <div>
                <strong>${item.title}</strong> <span class="tag">${item.category}</span>
                <div style="font-size: 13px; margin-top: 4px; color: #9c9285;">目前狀態：<b>${item.status}</b></div>
                <p style="margin: 8px 0 10px 0; color: #665c52; max-width: 450px;">${item.content}</p>
            </div>
            <div>
                <button class="btn-pass" onclick="updateStatus(${item.id}, '已通過')">通過</button>
                <button class="btn-reject" onclick="updateStatus(${item.id}, '已退回')">退回</button>
            </div>
        </div>
    `).join('');
}

async function updateStatus(id, status) {
    const res = await fetch(`/api/submissions/${id}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
    });
    if (res.ok) {
        alert(`已將稿件狀態更新為：${status}`);
        loadEditorSubmissions();
    } else {
        alert('更新失敗');
    }
}

loadEditorSubmissions();
</script>
</body>
