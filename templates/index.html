<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>投稿審查系統</title>
    <!-- 引入 Tailwind CSS 讓畫面乾淨整潔 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- 標題 -->
        <h1 class="text-3xl font-bold text-gray-800">📄 投稿審查系統</h1>

        <!-- 區塊一：新增投稿表單 -->
        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">發布新投稿</h2>
            <form id="submitForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600">標題 (Title)</label>
                    <input type="text" id="title" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">分類 (Category)</label>
                    <input type="text" id="category" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">內容 (Content)</label>
                    <textarea id="content" rows="3" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-400"></textarea>
                </div>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">送出投稿</button>
            </form>
        </div>

        <!-- 區塊二：投稿清單展示 -->
        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">現有投稿清單</h2>
            <button onclick="loadSubmissions()" class="bg-gray-200 text-gray-700 px-3 py-1 rounded-md text-sm mb-4 hover:bg-gray-300">重新整理清單</button>
            <div id="subList" class="space-y-3">
                <!-- 這裡會透過 JS 動態載入資料 -->
            </div>
        </div>

    </div>

    <!-- 串接 API 的 JavaScript -->
    <script>
        const API_URL = "http://127.0.0.1:8000";

        // 1. 提交表單事件
        document.getElementById("submitForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const data = {
                title: document.getElementById("title").value,
                category: document.getElementById("category").value,
                content: document.getElementById("content").value,
                author_id: 1 // 測試用固定作者 ID
            };

            const response = await fetch(`${API_URL}/api/submissions`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert("投稿成功！");
                document.getElementById("submitForm").reset();
                loadSubmissions();
            } else {
                alert("投稿失敗，請檢查輸入內容");
            }
        });

        // 2. 載入投稿清單
        async function loadSubmissions() {
            try {
                const res = await fetch(`${API_URL}/api/author/submissions`);
                const items = await res.json();
                const listDiv = document.getElementById("subList");
                listDiv.innerHTML = "";

                if (items.length === 0) {
                    listDiv.innerHTML = `<p class="text-gray-400">目前沒有任何投稿紀錄。</p>`;
                    return;
                }

                items.forEach(item => {
                    listDiv.innerHTML += `
                        <div class="p-4 border rounded-md bg-gray-50 flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-lg text-gray-800">${item.title}</h3>
                                <p class="text-sm text-gray-600">分類：${item.category} | 狀態：<span class="text-blue-600 font-semibold">${item.status || '審查中'}</span></p>
                                <p class="text-sm text-gray-500 mt-1">${item.content}</p>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("無法取得清單", err);
            }
        }

        // 網頁一打開自動載入清單
        loadSubmissions();
    </script>
</body>
</html>
